<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tide</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tide">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF2EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1E2C" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Young+Serif&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<style>
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --line:#D6DFDB; --ink:#13263A; --muted:#5B6E78;
  --sea:#2E6B6A; --brass:#9C7322; --danger:#A63A28; --scrim:rgba(19,38,58,.42);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1E2C; --surface:#172A3B; --line:#24394C; --ink:#E8EEEA; --muted:#8FA3AE;
    --sea:#7FB7A8; --brass:#D4AF5A; --danger:#E58A73; --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1E2C; --surface:#172A3B; --line:#24394C; --ink:#E8EEEA; --muted:#8FA3AE;
  --sea:#7FB7A8; --brass:#D4AF5A; --danger:#E58A73; --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:8px}
.ic{display:inline-grid;place-items:center;line-height:0}

.wrap{max-width:640px;margin:0 auto;padding:20px 18px 40px}
body.has-mini .wrap{padding-bottom:120px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:10px 0 20px}
h1{font-family:"Young Serif",Georgia,"Times New Roman",serif;font-weight:400;font-size:46px;line-height:1;margin:0;letter-spacing:-.01em}
.add{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--bg);padding:10px 16px 10px 12px;border-radius:999px;font-weight:600;font-size:15px}

.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{padding:8px 0 10px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--brass)}

.search{width:100%;font:inherit;font-size:16px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin:2px 0 6px}
.search::placeholder{color:var(--muted)}

.row{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;padding:10px 2px}
.meta{display:flex;flex-direction:column;min-width:0;flex:1}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.playing .t{color:var(--sea)}
.dur{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.more{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--muted);flex:none}

.thumb{flex:none;border-radius:8px;object-fit:cover;display:block;background:var(--line)}
.disc{display:block;flex:none;border-radius:50%;background:radial-gradient(circle,var(--bg) 0 7%,hsl(var(--h) 40% 50%) 8% 36%,#1b1b1b 37% 100%)}

.empty{padding:48px 8px;text-align:center;color:var(--muted)}
.empty h2{font-family:"Young Serif",Georgia,serif;font-weight:400;color:var(--ink);font-size:26px;margin:0 0 8px}
.empty p{margin:0 auto 18px;max-width:34ch}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:999px;font-weight:600;border:1px solid var(--line);background:var(--surface)}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{font-size:14px;color:var(--muted);margin:10px 0}

.pl-tile{width:46px;height:46px;border-radius:8px;flex:none;background:linear-gradient(135deg,hsl(var(--h) 38% 46%),hsl(calc(var(--h) + 40) 40% 30%))}
.pl-head{display:flex;flex-direction:column;gap:12px;margin:4px 0 12px}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--muted);font-weight:500;align-self:flex-start;margin-left:-6px}
.pl-head h2{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:30px;line-height:1.1;margin:0}
.pl-actions{display:flex;gap:10px;flex-wrap:wrap}
.linkish{color:var(--danger);font-weight:500;margin-top:24px}

.mini{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:none}
.mini.show{display:block}
.mini-progress{position:absolute;top:-1px;left:0;height:2px;width:0;background:var(--brass)}
.mini-inner{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.mini-open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.mini-play{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);flex:none}

.np{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 24px calc(28px + env(safe-area-inset-bottom,0px));transform:translateY(100%);visibility:hidden;transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s linear .34s}
.np.open{transform:none;visibility:visible;transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s}
.np-top{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:420px;width:100%;margin:0 auto}
.np-from{font-size:14px;color:var(--muted);text-align:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);position:relative}
.iconbtn.on{color:var(--brass)}
.iconbtn .one{position:absolute;top:7px;right:6px;font-size:10px;font-weight:600}
.deck{flex:1;display:grid;place-items:center;min-height:0;padding:18px 0}
.platter{position:relative;width:min(80vw,44vh,340px);aspect-ratio:1}
.record{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle at center,#151515 0 1.5px,#232323 1.5px 3px);box-shadow:0 20px 44px rgba(0,0,0,.28),inset 0 0 0 5px #0d0d0d;animation:spin 1.8s linear infinite;animation-play-state:paused}
.record.spinning{animation-play-state:running}
.label{position:absolute;inset:31%;border-radius:50%;overflow:hidden;background:hsl(var(--h,200) 40% 50%);display:grid;place-items:center;text-align:center;padding:12%;font-family:"Young Serif",Georgia,serif;color:#fff;font-size:clamp(9px,2.4vw,13px);line-height:1.15}
.label img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.label::after{content:"";position:absolute;width:9%;height:9%;left:45.5%;top:45.5%;border-radius:50%;background:var(--bg);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.sheen{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(from 20deg,transparent 0 6%,rgba(255,255,255,.09) 12%,transparent 20% 50%,rgba(255,255,255,.07) 62%,transparent 70%)}
@keyframes spin{to{transform:rotate(360deg)}}
.np-meta{max-width:420px;width:100%;margin:0 auto}
.np-meta h2{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:28px;line-height:1.15;margin:0 0 4px;overflow-wrap:anywhere}
.np-meta p{margin:0;color:var(--muted)}
.seek{max-width:420px;width:100%;margin:18px auto 6px}
.seek input{width:100%;accent-color:var(--brass);margin:0}
.times{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:4px}
.controls{max-width:360px;width:100%;margin:8px auto 0;display:flex;align-items:center;justify-content:space-between}
.playbtn{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg)}

.sheet-back{position:fixed;inset:0;z-index:30;background:var(--scrim);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s linear .2s}
.sheet-back.open{opacity:1;visibility:visible;transition:opacity .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:640px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 20px calc(18px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto;transform:translateY(100%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s}
.sheet.open{transform:none;visibility:visible;transition:transform .25s ease}
.sheet h3{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:22px;line-height:1.2;margin:0 0 6px;overflow-wrap:anywhere}
.sheet .sub{color:var(--muted);margin:0 0 8px}
.item{display:block;width:100%;text-align:left;padding:14px 2px;border-bottom:1px solid var(--line);font-weight:500}
.item:last-child{border-bottom:0}
.item.danger{color:var(--danger)}
.newpl{display:flex;gap:8px;margin:6px 0 10px}
.newpl input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.sheet-head h3{margin:0;min-width:0}
.btn:disabled{opacity:.45;cursor:default}
.pick{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.pick:last-child{border-bottom:0}
.pick input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--brass)}
.pick-search{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:4px}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.dropping .wrap{outline:2px dashed var(--brass);outline-offset:-8px;border-radius:16px}

@media (prefers-reduced-motion:reduce){
  .record{animation:none}
  .np,.np.open,.sheet,.sheet.open,.sheet-back,.sheet-back.open,.toast{transition:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Tide</h1>
    <button class="add" id="addBtn"></button>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabSongs" aria-selected="true">Songs</button>
    <button class="tab" role="tab" id="tabLists" aria-selected="false">Playlists</button>
  </div>
  <main id="view"></main>
</div>

<input type="file" id="file" accept="audio/*,.mp3,.m4a,.aac,.flac,.wav,.ogg,.opus" multiple hidden>
<audio id="audio" preload="auto"></audio>

<div class="mini" id="mini">
  <div class="mini-progress" id="miniProg"></div>
  <div class="mini-inner">
    <button class="mini-open" id="miniOpen" aria-label="Open now playing">
      <span id="miniThumb"></span>
      <span class="meta"><span class="t" id="miniTitle"></span><span class="a" id="miniArtist"></span></span>
    </button>
    <button class="mini-play" id="miniPlay" aria-label="Play"></button>
  </div>
</div>

<section class="np" id="np" aria-label="Now playing" aria-hidden="true" inert>
  <div class="np-top">
    <button id="npClose" class="iconbtn" aria-label="Close now playing"></button>
    <span class="np-from" id="npFrom"></span>
    <span style="width:44px"></span>
  </div>
  <div class="deck">
    <div class="platter">
      <div class="record" id="record"><div class="label" id="label"></div></div>
      <div class="sheen"></div>
    </div>
  </div>
  <div class="np-meta"><h2 id="npTitle"></h2><p id="npArtist"></p></div>
  <div class="seek">
    <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
    <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
  </div>
  <div class="controls">
    <button id="shuf" class="iconbtn" aria-label="Shuffle" aria-pressed="false"></button>
    <button id="prev" class="iconbtn" aria-label="Previous"></button>
    <button id="play" class="playbtn" aria-label="Play"></button>
    <button id="next" class="iconbtn" aria-label="Next"></button>
    <button id="rep" class="iconbtn" aria-label="Repeat off"></button>
  </div>
</section>

<div class="sheet-back" id="sheetBack"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true"><div id="sheetBody"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ---------- icons ---------- */
var S='fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"';
var I={
  play:'<path d="M8 5.5v13l11-6.5z"/>',
  pause:'<path d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z"/>',
  next:'<path d="M5.5 6l9 6-9 6z"/><path d="M16 6h2.5v12H16z"/>',
  prev:'<path d="M18.5 6l-9 6 9 6z"/><path d="M5.5 6H8v12H5.5z"/>',
  shuffle:'<path '+S+' d="M4 7h3c2.2 0 3.2 1.2 4.3 3.4l1.4 3.2C13.8 15.8 14.8 17 17 17h3M17.5 14.5L20 17l-2.5 2.5M4 17h3c1.1 0 1.9-.3 2.6-.9M14.4 7.9c.7-.6 1.5-.9 2.6-.9h3M17.5 4.5L20 7l-2.5 2.5"/>',
  repeat:'<path '+S+' d="M5 11V9.5A2.5 2.5 0 0 1 7.5 7H19M16 4l3 3-3 3M19 13v1.5a2.5 2.5 0 0 1-2.5 2.5H5M8 20l-3-3 3-3"/>',
  more:'<circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/>',
  down:'<path '+S+' d="M6 9l6 6 6-6"/>',
  back:'<path '+S+' d="M15 6l-6 6 6 6"/>',
  plus:'<path '+S+' d="M12 5v14M5 12h14"/>'
};
function icon(name,size){
  size=size||24;
  var s=document.createElement('span');s.className='ic';
  s.innerHTML='<svg viewBox="0 0 24 24" width="'+size+'" height="'+size+'" fill="currentColor" aria-hidden="true">'+I[name]+'</svg>';
  return s;
}
function setIcon(btn,name,size){btn.replaceChildren(icon(name,size));}

/* ---------- helpers ---------- */
function $(id){return document.getElementById(id);}
function el(tag,attrs){
  var n=document.createElement(tag);attrs=attrs||{};
  Object.keys(attrs).forEach(function(k){
    var v=attrs[k];
    if(k==='class')n.className=v;
    else if(k==='text')n.textContent=v;
    else if(k==='style')n.setAttribute('style',v);
    else if(k.indexOf('on')===0)n.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null)n.setAttribute(k,v===true?'':v);
  });
  for(var i=2;i<arguments.length;i++){
    var c=arguments[i];
    [].concat(c).forEach(function(x){if(x==null||x===false)return;n.append(x.nodeType?x:document.createTextNode(String(x)));});
  }
  return n;
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function hue(str){var h=0;str=str||'';for(var i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))>>>0;return h%360;}
function fmt(sec){if(!sec||!isFinite(sec))return '0:00';sec=Math.round(sec);var m=Math.floor(sec/60),s=sec%60;return m+':'+(s<10?'0':'')+s;}
var toastTimer;
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},2800);}

/* ---------- storage (IndexedDB, private to this browser) ---------- */
var db=null, songs=[], playlists=[];
function openDB(){
  return new Promise(function(res,rej){
    var r=indexedDB.open('tide',1);
    r.onupgradeneeded=function(){var d=r.result;
      if(!d.objectStoreNames.contains('songs'))d.createObjectStore('songs',{keyPath:'id'});
      if(!d.objectStoreNames.contains('playlists'))d.createObjectStore('playlists',{keyPath:'id'});};
    r.onsuccess=function(){res(r.result);};
    r.onerror=function(){rej(r.error);};
  });
}
function tx(store,mode,fn){
  if(!db)return Promise.resolve(null);
  return new Promise(function(res,rej){
    var t=db.transaction(store,mode),out=null,rq=fn(t.objectStore(store));
    if(rq)rq.onsuccess=function(){out=rq.result;};
    t.oncomplete=function(){res(out);};
    t.onerror=function(){rej(t.error);};
    t.onabort=function(){rej(t.error);};
  });
}
function getAll(store){return tx(store,'readonly',function(s){return s.getAll();});}
function put(store,v){return tx(store,'readwrite',function(s){return s.put(v);});}
function del(store,id){return tx(store,'readwrite',function(s){return s.delete(id);});}

var prefs={shuffle:false,repeat:'off'};
try{var p=JSON.parse(localStorage.getItem('tide-prefs')||'null');if(p)prefs=Object.assign(prefs,p);}catch(e){}
function savePrefs(){try{localStorage.setItem('tide-prefs',JSON.stringify(prefs));}catch(e){}}

/* ---------- art ---------- */
var artUrls={};
function artUrl(s){if(!s.art)return null;if(!artUrls[s.id])artUrls[s.id]=URL.createObjectURL(s.art);return artUrls[s.id];}
function disc(s,size){
  return el('span',{class:'disc','aria-hidden':'true',style:'--h:'+hue(s.title+s.artist)+';width:'+size+'px;height:'+size+'px'});
}
function thumb(s,size){
  var u=artUrl(s);
  if(!u)return disc(s,size);
  var img=el('img',{class:'thumb',src:u,alt:'',width:size,height:size,style:'width:'+size+'px;height:'+size+'px'});
  img.addEventListener('error',function(){img.replaceWith(disc(s,size));});
  return img;
}

/* ---------- importing ---------- */
function parseName(name){
  var base=name.replace(/\.[^.]+$/,'').replace(/_/g,' ').replace(/^\s*\d{1,3}[\s.\-]+/,'').trim();
  var parts=base.split(/\s+-\s+/);
  if(parts.length>=2)return {artist:parts[0].trim(),title:parts.slice(1).join(' - ').trim()};
  return {artist:'',title:base||name};
}
function readTags(file){
  return new Promise(function(res){
    var done=false;function fin(v){if(!done){done=true;res(v||{});}}
    setTimeout(function(){fin({});},8000);
    if(!window.jsmediatags)return fin({});
    try{
      window.jsmediatags.read(file,{
        onSuccess:function(t){
          var g=(t&&t.tags)||{},art=null;
          if(g.picture&&g.picture.data&&g.picture.data.length){
            try{art=new Blob([new Uint8Array(g.picture.data)],{type:g.picture.format||'image/jpeg'});}catch(e){}
          }
          fin({title:g.title,artist:g.artist,album:g.album,art:art});
        },
        onError:function(){fin({});}
      });
    }catch(e){fin({});}
  });
}
function getDuration(blob){
  return new Promise(function(res){
    var a=new Audio(),u=URL.createObjectURL(blob),done=false;
    function fin(d){if(done)return;done=true;URL.revokeObjectURL(u);res(isFinite(d)?d:0);}
    a.preload='metadata';
    a.onloadedmetadata=function(){fin(a.duration);};
    a.onerror=function(){fin(0);};
    setTimeout(function(){fin(0);},6000);
    a.src=u;
  });
}
var AUDIO_EXT=/\.(mp3|m4a|aac|flac|wav|ogg|oga|opus)$/i;
function addFiles(fileList){
  var list=[].slice.call(fileList).filter(function(f){return (f.type&&f.type.indexOf('audio/')===0)||AUDIO_EXT.test(f.name);});
  if(!list.length){toast('Those aren’t audio files. Choose MP3, M4A, FLAC, WAV or OGG.');return;}
  if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(function(){});}
  toast('Adding '+list.length+' song'+(list.length>1?'s':'')+'…');
  var added=0;
  (async function(){
    for(var i=0;i<list.length;i++){
      var f=list[i];
      try{
        var tags=await readTags(f),guess=parseName(f.name);

/* ---------- playback ---------- */
var audio=$('audio'),current=null,context=[],contextName='Your library',order=[],pos=-1,currentUrl=null;
function byId(id){for(var i=0;i<songs.length;i++)if(songs[i].id===id)return songs[i];return null;}

/* iPhone Safari often fails to play audio straight from browser storage,

var memUrls={},loadToken=0;
var EXT_MIME={mp3:'audio/mpeg',m4a:'audio/mp4',mp4:'audio/mp4',aac:'audio/aac',flac:'audio/flac',wav:'audio/wav',ogg:'audio/ogg',oga:'audio/ogg',opus:'audio/ogg'};
var TYPE_NAME={'audio/mpeg':'MP3','audio/mp4':'M4A','audio/aac':'AAC','audio/flac':'FLAC','audio/wav':'WAV','audio/ogg':'OGG'};
function guessType(s){
  var m=(s.name||'').toLowerCase().match(/\.([a-z0-9]+)$/);
  if(m&&EXT_MIME[m[1]])return EXT_MIME[m[1]];
  var t=(s.type||'').toLowerCase();
  if(t==='audio/x-m4a'||t==='audio/m4a')return 'audio/mp4';
  if(/mp3|mpeg|mpg/.test(t))return 'audio/mpeg';
  return t||'audio/mpeg';
}
function sniff(buf,fallback){
  var b=new Uint8Array(buf,0,Math.min(12,buf.byteLength));
  function is(o,str){for(var i=0;i<str.length;i++)if(b[o+i]!==str.charCodeAt(i))return false;return true;}
  if(is(4,'ftyp'))return 'audio/mp4';
  if(is(0,'fLaC'))return 'audio/flac';
  if(is(0,'RIFF'))return 'audio/wav';
  if(is(0,'OggS'))return 'audio/ogg';
  if(is(0,'ID3'))return 'audio/mpeg';
  if(b[0]===0xFF&&(b[1]&0xF6)===0xF0)return 'audio/aac';
  if(b[0]===0xFF&&(b[1]&0xE0)===0xE0)return 'audio/mpeg';

}

    s.playType=sniff(buf,guessType(s));

  var i=order.indexOf(id);if(i>-1&&i!==pos){order.splice(i,1);if(i<pos)pos--;}

audio.addEventListener('play',syncPlayState);
audio.addEventListener('pause',syncPlayState);

  if(!seeking){$('seek').value=Math.round(frac*1000);$('tCur').textContent=fmt(c);}
  $('tDur').textContent=fmt(d&&isFinite(d)?d:(current&&current.duration));

    try{navigator.mediaSession.setPositionState({duration:d,position:Math.min(c,d),playbackRate:audio.playbackRate||1});}catch(e){}

  [['play',function(){audio.play().catch(function(){});}],['pause',function(){audio.pause();}],
   ['previoustrack',prev],['nexttrack',function(){next(false);}],

function deleteSong(id){
  songs=songs.filter(function(s){return s.id!==id;});
  if(artUrls[id]){URL.revokeObjectURL(artUrls[id]);delete artUrls[id];}
  playlists.forEach(function(pl){if(pl.songIds.indexOf(id)>-1){pl.songIds=pl.songIds.filter(function(i){return i!==id;});put('playlists',pl);}});
  context=context.filter(function(i){return i!==id;});
  var i=order.indexOf(id);

  if(current&&current.id===id){

    if(order.length){pos=Math.min(pos,order.length-1);loadAt(pos,false);}else{order=[];pos=-1;updateNow();}

    songs=(await getAll('songs'))||[];
    playlists=(await getAll('playlists'))||[];
  }catch(e){
    db=null;
    $('view').before(el('p',{class:'note',text:'This browser isn’t letting Tide save songs, so anything you add will be gone when you close the page.'}));
  }
  render();
  for(var i=0;i<songs.length;i++){try{await prepare(songs[i]);}catch(e){}}
})();
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
</body>
